# The whole test suite runs without a printer, which is what makes a matrix
# worth having: the encoder is pure, so a failure here is a real portability
# problem and not a flaky device.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other eight.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Guards the one mistake that only shows up after publishing: an entry in
      # `exports` that resolves to a file the build never emitted.
      - run: npm run check:exports
