# The whole test suite runs without a printer, which is what makes a matrix
# worth having: the encoder is pure, so a failure here is a real portability
# problem and not a flaky device.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other eight.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 is the floor `engines` promises, so it gets tested like the rest.
        # It is deliberately absent from the build job below — see there.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  # Bundling runs in one place, the way publishing does — there is no such thing
  # as a per-platform dist/. It is also the only way it can run: tsdown declares
  # `engines: ^22.18.0 || >=24.11.0` because it loads tsdown.config.ts through
  # Node's native type stripping, falling back to `unrun` where that is missing.
  # Node 20 has neither, so the build cannot run there.
  #
  # The library itself is fine on Node 20 — the matrix above proves it every
  # run. Only the toolchain has the higher floor.
  build:
    name: build · node 24
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Guards the one mistake that only shows up after publishing: an entry in
      # `exports` that resolves to a file the build never emitted.
      - run: npm run check:exports
